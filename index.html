<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Practice</title>
  <style>
    :root {
      --bg: #edf1f7;
      --surface: #ffffff;
      --text: #1a202c;
      --muted: #66767a;
      --line: #dbe3e5;
      --hotel: #1b2d4f;
      --shadowing: #4f8a94;
      --present: #8a5a2b;
      --shadow: 0 1px 2px rgba(20, 40, 45, .06), 0 4px 16px rgba(20, 40, 45, .08);
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    main { width: 100%; max-width: 760px; }
    h1 { margin: 0 0 .25rem; font-size: 1.8rem; text-align: center; }
    .subtitle { margin: 0 0 2rem; color: var(--muted); text-align: center; }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.25rem;
    }
    .card {
      display: block;
      background: var(--surface);
      border: 1px solid var(--line);
      border-top: 5px solid var(--accent);
      border-radius: 14px;
      padding: 1.5rem;
      text-decoration: none;
      color: inherit;
      box-shadow: var(--shadow);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .card:hover, .card:focus-visible {
      transform: translateY(-3px);
      box-shadow: 0 6px 24px rgba(20, 40, 45, .15);
      outline: none;
    }
    .card.hotel { --accent: var(--hotel); }
    .card.shadowing { --accent: var(--shadowing); }
    .card.present { --accent: var(--present); }
    .card h2 { margin: 0 0 .5rem; font-size: 1.25rem; color: var(--accent); }
    .card p { margin: 0 0 1rem; color: var(--muted); }
    .card .go { font-weight: 600; color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>English Practice</h1>
    <p class="subtitle">Chọn chương trình học</p>
    <div class="cards">
      <a class="card hotel" href="hotel-english/index.html">
        <h2>Hotel English</h2>
        <p>Tiếng Anh giao tiếp trong khách sạn theo từng unit.</p>
        <span class="go">Vào học →</span>
      </a>
      <a class="card shadowing" href="shadowing-english/index.html">
        <h2>Shadowing English</h2>
        <p>Luyện nói theo phương pháp shadowing theo level.</p>
        <span class="go">Vào học →</span>
      </a>
      <a class="card present" href="present/index.html">
        <h2>Bản đồ 12 thì</h2>
        <p>Tổng quan 12 thì tiếng Anh: cấu trúc và cách dùng.</p>
        <span class="go">Xem →</span>
      </a>
    </div>
  </main>
</body>
</html>
